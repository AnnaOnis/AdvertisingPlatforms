stages:
  - test
  - sast
  - docker-publish
  - cleanup
  - migrate
  - deploy
  - security_scan
  - dast

variables:
  # .NET
  DOTNET_VERSION: "9.0"
  SOLUTION_FILE: "AdvertisingPlatforms.sln"
  PROJECT_PATH: "AdvertisingPlatforms.WebAPI/AdvertisingPlatforms.Web.csproj"
  BUILD_CONFIGURATION: "Release"

  # Docker/Registry
  DOCKER_REGISTRY: nexus.effective-mobile.ru:5000
  DOCKER_TAG: "$CI_COMMIT_REF_SLUG"
  DOCKER_IMAGE: "$DOCKER_REGISTRY/$CI_PROJECT_NAME:$DOCKER_TAG"

  # Кэши и артефакты
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  NUGET_PACKAGES_DIR: "$CI_PROJECT_DIR/.nuget/packages"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/artifacts"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  
  # Деплой
  SERVER_USER: devops
  SERVER_IP: 83.220.169.66
  USER_PORT: 5004

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/
    - .trivycache/

# ---------- TESTS (MANUAL) ----------
unit-test-job:   
  stage: test    
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
     - dotnet test
     - dotnet test --no-restore --configuration $BUILD_CONFIGURATION
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- SAST / SONAR ----------
sonarqube-check-job:
  stage: sast
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" 
    GIT_DEPTH: "0"  
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - apt-get update -y && apt-get install -y openjdk-17-jdk
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
  script: 
      - dotnet sonarscanner begin /k:"AdvertisingPlatformsAnna" /d:sonar.login=$SONAR_TOKEN /d:sonar.host.url=$SONAR_HOST_URL
      - dotnet build --configuration $BUILD_CONFIGURATION
      - dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- DOCKER BUILD & PUSH (socket mode) ----------
docker-publish-job:
  stage: docker-publish
  image: docker:24.0.5
  needs:
    - sonarqube-check-job
  script:
    - docker login $DOCKER_REGISTRY -u $NEXUS_USER -p $NEXUS_PASSWORD
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- CLEANUP: чистим локальные слои/кэш на раннере ----------
cleanup-runner-cache:
  stage: cleanup
  image: docker:24.0.5
  needs: ["docker-publish-job"]
  script:
    - docker rmi "$DOCKER_IMAGE" || true
    - docker image prune -f
    - docker builder prune -af
    - docker container prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'


# ---------- (опционально) MIGRATIONS ----------
migrate-database-job:
  stage: migrate
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet tool install --global dotnet-ef || true
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet ef database update --project AdvertisingPlatforms.DAL/AdvertisingPlatforms.DAL.csproj --startup-project AdvertisingPlatforms.WebAPI/AdvertisingPlatforms.Web.csproj --connection "$CONNECTION_STRING"
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- DEPLOY ----------
deploy-job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-keygen -p -P "password" -N "" -f ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
  script:
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker login $DOCKER_REGISTRY -u $NEXUS_USER -p $NEXUS_PASSWORD"
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker pull $DOCKER_IMAGE"
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker stop $CI_PROJECT_NAME || true && docker rm $CI_PROJECT_NAME || true"
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker run -d --name $CI_PROJECT_NAME -p $USER_PORT:8080 --restart always -e CONNECTION_STRING='$CONNECTION_STRING' $DOCKER_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- SECURITY SCAN (MANUAL, по образу) ----------
trivy-scan-job:
  stage: security_scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["docker-publish-job"]
  script:
    # Используем встроенную аутентификацию Trivy вместо docker login
    - /usr/local/bin/trivy registry login --username "$NEXUS_USER" --password "$NEXUS_PASSWORD" "$DOCKER_REGISTRY"
    - /usr/local/bin/trivy image --scanners vuln --severity HIGH,CRITICAL --cache-dir "$TRIVY_CACHE_DIR" "$DOCKER_IMAGE" --format json -o trivy-report.json
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 15 minutes
  allow_failure: true
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"'

# ---------- DAST (MANUAL, тяжёлый) ----------
zap-scan-job:
  stage: dast
  allow_failure: true
  image: zaproxy/zap-stable
  script:
      - zap-full-scan.py -t http://83.220.169.66:$USER_PORT/ \
        -J report-$CI_COMMIT_SHORT_SHA.json \
        -r report-$CI_COMMIT_SHORT_SHA.html
  artifacts:
    when: always
    paths:
      - report-$CI_COMMIT_SHORT_SHA.html
      - report-$CI_COMMIT_SHORT_SHA.json
    expire_in: 15 minutes 
  when: manual  
  rules:
    - if: '$CI_COMMIT_BRANCH == "modul_4"' 